<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://github.com https://avatars.githubusercontent.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>RepoPulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="collapsed">
  <section id="island" class="island">
    <button id="edgeReveal" aria-label="Reveal RepoPulse" aria-expanded="false"><span aria-hidden="true"></span></button>
    <section id="miniIsland" aria-label="Dynamic Island" hidden>
      <button id="miniExpand" title="Open advanced view" aria-label="Open advanced view">
        <span id="miniAvatar" aria-hidden="true"></span>
        <span class="mini-author"><span>github</span><strong id="miniTitle"></strong></span>
        <span id="miniSummary"></span>
      </button>
      <button id="miniLink" title="Open release on GitHub" aria-label="Open release on GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M10 13.5a4.5 4.5 0 0 0 6.36 0l3.18-3.18a4.5 4.5 0 0 0-6.36-6.36l-1.82 1.82"/>
          <path d="M14 10.5a4.5 4.5 0 0 0-6.36 0l-3.18 3.18a4.5 4.5 0 0 0 6.36 6.36l1.82-1.82"/>
        </svg>
      </button>
    </section>
    <header class="topbar">
      <button id="toggle" class="brand" title="Open RepoPulse commands" aria-label="Open RepoPulse commands">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 1a11 11 0 0 0-3.48 21.44c.55.1.75-.24.75-.53v-2.04c-3.06.66-3.71-1.3-3.71-1.3-.5-1.27-1.22-1.61-1.22-1.61-1-.68.08-.67.08-.67 1.1.08 1.68 1.13 1.68 1.13.98 1.68 2.57 1.19 3.2.91.1-.71.38-1.19.69-1.46-2.44-.28-5.01-1.22-5.01-5.44 0-1.2.43-2.18 1.13-2.95-.12-.28-.49-1.4.11-2.91 0 0 .93-.3 3.03 1.13a10.56 10.56 0 0 1 5.5 0c2.1-1.43 3.02-1.13 3.02-1.13.6 1.51.23 2.63.12 2.91.7.77 1.13 1.75 1.13 2.95 0 4.23-2.57 5.16-5.03 5.43.39.34.75 1.01.75 2.04v3.01c0 .29.2.64.76.53A11 11 0 0 0 12 1Z"/>
        </svg>
        <b>GitHub <span>RSS+</span></b>
      </button>
      <span id="connectionDot" class="connection-dot" aria-hidden="true"></span>
      <span id="status" class="status" role="status">Connecting to GitHub</span>
      <div id="dockHint" hidden>
        <button id="dockOpen" aria-label="Open current repository on GitHub" aria-describedby="dockSummary">
          <strong id="dockText"></strong>
          <span id="dockSummary"></span>
        </button>
      </div>
      <div class="toolbar" role="group" aria-label="Panel commands">
        <button id="miniButton" title="Switch to Dynamic Island" aria-label="Switch to Dynamic Island">Island</button>
        <button id="plusButton" title="Manage RSS+ membership">RSS+</button>
        <button id="commandButton" title="Command palette" aria-label="Open command palette">Commands</button>
        <button id="pinButton" title="Always on top" aria-label="Always on top" aria-pressed="false"></button>
        <button id="focusButton" title="Focus session (F)" aria-label="Start focus session"></button>
        <button id="historyButton" title="History" aria-label="Open history"></button>
        <button id="refresh" title="Sync with GitHub (R)" aria-label="Force GitHub sync"></button>
        <button id="menu" title="Settings" aria-label="Open settings" aria-expanded="false"></button>
      </div>
    </header>
    <div id="expanded">
      <div class="feed-heading">
        <div>
          <h1>Discover</h1>
          <p><span id="editionLabel"></span><span class="muted-separator" aria-hidden="true">·</span><span id="libraryStat"></span></p>
        </div>
        <div class="live-controls">
          <button id="liveToggle" aria-label="Pause automatic repository rotation" aria-pressed="true">Live</button>
        </div>
        <button id="browseLibrary" class="browse-button" title="Open the cached project library">Library</button>
      </div>
      <main id="discoveryPanel" aria-label="Personalized repositories">
        <div id="feed" aria-label="Repository choices"></div>
      </main>
      <footer>
        <span id="systemInfo" class="system-info"></span>
        <span id="pickRange" class="pick-range" role="status"></span>
        <div class="foot-actions">
          <button id="autoHideButton" role="switch" aria-checked="true" aria-label="Auto hide" title="Toggle automatic collapse"><span class="switch-track" aria-hidden="true"></span><span id="autoHideLabel">Auto hide</span></button>
          <button id="queueButton" title="Open reading queue">Queue <span id="queueCount">0</span></button>
          <button id="next" title="Show the next picks">Next picks <span aria-hidden="true">→</span></button>
          <button id="collapse" title="Collapse island" aria-label="Collapse island"></button>
        </div>
      </footer>
      <section id="drawer" hidden>
        <nav aria-label="Workspace">
          <div class="workspace-brand"><strong id="workspaceContext">Workspace</strong></div>
          <button data-tab="details">Overview</button>
          <button data-tab="library">Library</button>
          <button data-tab="collections">Collections</button>
          <button data-tab="compare">Compare</button>
          <button data-tab="insights">Insights</button>
          <button data-tab="saved">Saved</button>
          <button data-tab="history">History</button>
          <button data-tab="tune">Interests</button>
          <button data-tab="plus">RSS+</button>
          <button data-tab="settings">Settings</button>
          <button data-tab="exclusions">Exclusions</button>
          <button id="closeDrawer" aria-label="Close workspace">Discover</button>
        </nav>
        <div id="drawerContent" tabindex="-1"></div>
      </section>
    </div>
    <aside id="idleInsight" hidden aria-label="Work recommendation">
      <div class="insight-heading"><span>Suggested repository</span><button id="insightDismiss" aria-label="Dismiss recommendation">Close</button></div>
      <a id="insightName" href="#" class="insight-name"></a>
      <p id="insightDescription"></p>
      <p id="insightReason" class="field-hint"></p>
      <div class="insight-actions"><button id="insightOpen" class="primary">Open on GitHub</button><button id="insightDisable" class="secondary">Turn off</button></div>
    </aside>
    <div id="notifications"><div id="toast" role="status" aria-live="polite" hidden></div></div>
  </section>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <script src="feed-ui.js"></script>
  <script src="morph.js"></script>
  <script src="ui-core.js"></script>
  <script src="island-motion.js"></script>
  <script src="dynamic-feed.js"></script>
  <script src="ultimate.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
