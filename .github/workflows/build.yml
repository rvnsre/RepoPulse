name: Build and verify RepoPulse
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect and validate real GitHub repositories
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-catalog.cjs src/catalog-seed.json
      - name: Preserve resumable public catalog pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-catalog-checkpoint
          path: src/catalog-seed.json.checkpoint/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-catalog
          path: src/catalog-seed.json
          if-no-files-found: error
  package:
    needs: [verify, catalog]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependency critical vulnerabilities
        if: runner.os == 'Linux'
        run: npm audit --audit-level=critical
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb xdotool libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Native UI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Upload native preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-native-preview
          path: dist/*preview.png
          if-no-files-found: error
      - name: Upload dependency lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-dependency-lock
          path: package-lock.json
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: RepoPulse-catalog
          path: src
      - name: Package desktop app
        run: npm run dist
        if: runner.os != 'macOS'
      - name: Package macOS for the runner architecture
        if: runner.os == 'macOS'
        run: npm run dist -- --mac --${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Start the packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-startup.ps1
      - name: Upload installers and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-${{ runner.os }}${{ matrix.os == 'macos-15-intel' && '-Intel' || '' }}
          path: |
            dist/*.png
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            package-lock.json
          if-no-files-found: error
          retention-days: 30
  extension:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-browser-companion
          path: extension/
          retention-days: 30
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [verify, catalog, package, extension]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
