name: Build and verify RepoPulse
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:accessibility -- --no-sandbox
      - if: runner.os != 'Linux'
        run: npm run test:accessibility
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: RepoPulse-integration-${{ matrix.os }}
          path: dist/accessibility/
          if-no-files-found: error
  integration:
    needs: integration-platform
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all four renderer platform checks
        env:
          PLATFORM_RESULT: ${{ needs.integration-platform.result }}
        run: test "$PLATFORM_RESULT" = success
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076a # v4
        with:
          output: dist/security/codeql
          upload: never
          upload-database: false
      - name: Reject unresolved scan results or missing evidence
        run: node scripts/check-security-evidence.cjs dist/security/codeql
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: RepoPulse-security-sarif
          path: dist/security/codeql/
          if-no-files-found: error
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm audit --audit-level=low --json > dependency-audit.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: RepoPulse-dependency-audit
          path: dependency-audit.json
          if-no-files-found: error
  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm sbom --sbom-format cyclonedx --sbom-type application --package-lock-only > sbom.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: RepoPulse-sbom
          path: sbom.cdx.json
          if-no-files-found: error
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install pinned open-source scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan full checked-out history with redacted output
        shell: bash
        run: |
          mkdir -p dist/security
          set +e
          "$(go env GOPATH)/bin/gitleaks" git --redact=100 --no-banner --ignore-gitleaks-allow --timeout 300 --exit-code 1 --report-format json --report-path dist/security/gitleaks.json .
          scan_status=$?
          set -e
          node scripts/check-security-evidence.cjs secrets dist/security/gitleaks.json dist/security/secret-summary.json
          exit "$scan_status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: RepoPulse-secret-scan-summary
          path: dist/security/secret-summary.json
          if-no-files-found: error
  data-integrity:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: RepoPulse-catalog
          path: src
      - run: node scripts/validate-catalog.cjs src/catalog-seed.json
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
  accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: xvfb-run -a npm run test:accessibility -- --no-sandbox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RepoPulse-accessibility-evidence
          path: dist/accessibility/
          if-no-files-found: error
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect and validate real GitHub repositories
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-catalog.cjs src/catalog-seed.json
      - name: Preserve resumable public catalog pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-catalog-checkpoint
          path: src/catalog-seed.json.checkpoint/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-catalog
          path: src/catalog-seed.json
          if-no-files-found: error
  package:
    needs: [verify, catalog]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependency critical vulnerabilities
        if: runner.os == 'Linux'
        run: npm audit --audit-level=critical
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb xdotool libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Native UI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Upload native preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-native-preview
          path: dist/*preview.png
          if-no-files-found: error
      - name: Upload dependency lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-dependency-lock
          path: package-lock.json
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: RepoPulse-catalog
          path: src
      - name: Package desktop app
        run: npm run dist
        if: runner.os != 'macOS'
      - name: Package macOS for the runner architecture
        if: runner.os == 'macOS'
        run: npm run dist -- --mac --${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - name: Start the packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-startup.ps1
      - name: Upload installers and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-${{ runner.os }}${{ matrix.os == 'macos-15-intel' && '-Intel' || '' }}
          path: |
            dist/*.png
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            package-lock.json
          if-no-files-found: error
          retention-days: 30
  extension:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-browser-companion
          path: extension/
          retention-days: 30
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: [verify, catalog, package, extension, accessibility, integration, security, dependency-audit, sbom, secret-scan, data-integrity]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
