name: Build and verify RepoPulse
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependency critical vulnerabilities
        if: runner.os == 'Linux'
        run: npm audit --audit-level=critical
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm xvfb xdotool libgtk-3-0 libnss3 libasound2t64 libgbm1
      - name: Native UI smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke -- --no-sandbox
      - name: Upload native preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-native-preview
          path: dist/*preview.png
          if-no-files-found: error
      - name: Upload dependency lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-dependency-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Package desktop app
        run: npm run dist
      - name: Upload installers and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-${{ runner.os }}
          path: |
            dist/*.png
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            package-lock.json
          if-no-files-found: error
          retention-days: 30
  extension:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: RepoPulse-browser-companion
          path: extension/
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release RepoPulse v11.9.1')
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: RepoPulse-*
          path: release-artifacts
      - name: Prepare the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag=v$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$tag" = "$REF_NAME"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "RepoPulse $tag" --notes-file docs/RELEASE-v11.9.1.md
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Attach verified installers and SHA-256 checksums to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.cjs release-artifacts


      - name: Publish the complete release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
