name: Publish verified release assets
on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag. Leave blank to use package.json.
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ inputs.tag || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact tag and verified build
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const {execFileSync} = require('node:child_process');
          const command = (name, ...args) => execFileSync(name, args, {encoding:'utf8'}).trim();
          const api = endpoint => JSON.parse(command('gh', 'api', endpoint));
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.INPUT_TAG || 'v' + require('./package.json').version;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) throw Error('Expected a stable version tag.');
          const sameBuild = process.env.GITHUB_EVENT_NAME === 'push';
          const mainBuild = sameBuild && process.env.GITHUB_REF === 'refs/heads/main';
          let taggedSha;
          try {taggedSha = command('git', 'rev-parse', '--verify', '--quiet', 'refs/tags/' + tag + '^{commit}');} catch {}
          if (mainBuild && taggedSha && taggedSha !== process.env.GITHUB_SHA) {
            console.log('Version ' + tag + ' already belongs to another commit. Bump package.json to release this commit.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'skip=true\n');
            process.exit(0);
          }
          const sha = taggedSha || (mainBuild && process.env.GITHUB_SHA);
          if (!sha) throw Error('No existing tag found for ' + tag);
          const source = JSON.parse(command('git', 'show', sha + ':package.json'));
          if ('v' + source.version !== tag) throw Error('Tag must match the tagged package.json version.');
          const root = 'repos/' + repo + '/actions/';
          if (sameBuild && ((!mainBuild && process.env.GITHUB_REF !== 'refs/tags/' + tag) || process.env.GITHUB_SHA !== sha)) throw Error('Release commit changed during build.');
          const runs = sameBuild ? [{id:Number(process.env.GITHUB_RUN_ID),run_attempt:Number(process.env.GITHUB_RUN_ATTEMPT)}] :
            api(root + 'workflows/build.yml/runs?event=push&status=completed&head_sha=' + sha + '&per_page=100').workflow_runs.filter(run => (run.head_branch === tag || run.head_branch === 'main') && run.head_sha === sha);
          const {missingGates} = require('./scripts/release-gates.cjs');
          const build = runs.find(run => {
            const jobs = api(root + 'runs/' + run.id + '/attempts/' + run.run_attempt + '/jobs?per_page=100').jobs;
            const missing = missingGates(jobs);
            if (missing.length) console.log('Publication blocked; missing or unsuccessful gates: ' + missing.join(', '));
            return missing.length === 0;
          });
          if (!build) throw Error('No successful package build was found for the exact tag.');
          let notes = '';
          try {notes = command('git', 'show', sha + ':docs/RELEASE-' + tag + '.md');} catch {}
          if (notes) fs.writeFileSync(process.env.RUNNER_TEMP + '/repopulse-release.md', notes + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, 'RELEASE_TAG=' + tag + '\nRELEASE_VERSION=' + source.version + '\nRELEASE_SHA=' + sha + '\n');
          console.log('Verified build ' + build.id + ' for ' + tag);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'run_id=' + build.id + '\n');
          JS
        id: build
      - uses: actions/download-artifact@v4
        if: steps.build.outputs.skip != 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.build.outputs.run_id }}
          pattern: RepoPulse-*
          path: release-artifacts
      - name: Validate artifacts, then publish a complete draft
        if: steps.build.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release-artifacts/RepoPulse-catalog/catalog-seed.json
          node scripts/release.cjs release-artifacts --validate-only --require-mac-architectures
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$RELEASE_SHA" >/dev/null
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$actual" = "$RELEASE_SHA"
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/repopulse-release.json"; then
            if [[ "$(jq -r .isDraft "$RUNNER_TEMP/repopulse-release.json")" != true ]]; then
              echo "::notice::Release $RELEASE_TAG is already published."
              exit 0
            fi
          else
            notes="$RUNNER_TEMP/repopulse-release.md"
            if [[ -s "$notes" ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "RepoPulse $RELEASE_TAG" --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "RepoPulse $RELEASE_TAG" --generate-notes
            fi
          fi
          node scripts/release.cjs release-artifacts --require-mac-architectures
          gh release upload "$RELEASE_TAG" release-artifacts/RepoPulse-catalog/catalog-seed.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
